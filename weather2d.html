<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今明兩日天氣預報 | 澳門氣象中心</title>
    <link class="js-meta-tag" rel="icon" href="mmclogo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
    <!-- 🌟 引入天氣圖標共用工具 (文字版仍需要用到) -->
    <script src="weather-utils.js"></script>

    <style>
        [v-cloak] { display: none; }

        body {
            background: #ffffff;
            padding: 1.25rem;
            font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
            color: #1f2937;
            line-height: 1.9;
            font-size: 0.95rem;
        }

        .weather-text {
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 48rem;
            margin: 0 auto;
            color: #1f2937;
        }

        @media (max-width: 640px) {
            body { padding: 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div id="app" v-cloak>

    <!-- 🌟 網頁主體保留純文字版 -->
    <div class="weather-text">{{ text }}</div>

    <!-- ★ 浮動「圖文版」按鈕 -->
    <button type="button"
            class="fixed bottom-4 right-4 z-50
                   inline-flex items-center gap-2 px-4 py-2 rounded-lg font-medium
                   shadow-md text-sm bg-blue-700 text-white hover:bg-blue-800
                   transition-colors"
            aria-label="開啟圖文版今明兩日天氣預報"
            @click="openGraphic">
        <i class="fa-solid fa-image" aria-hidden="true"></i>
        <span>圖文版</span>
    </button>

    <!-- ★ 圖文版模態框 (直接顯示 Python 生成的圖片) -->
    <div v-if="showGraphic"
         class="fixed inset-0 z-[2000] flex items-center justify-center p-2 sm:p-4"
         role="dialog"
         aria-modal="true"
         aria-labelledby="graphic-modal-title">

        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="closeGraphic"></div>

        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[92vh] flex flex-col overflow-hidden">

            <!-- 頂部工具列 -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 bg-blue-50 flex-shrink-0">
                <h3 id="graphic-modal-title" class="text-base sm:text-lg font-bold text-blue-800 flex items-center gap-2">
                    <i class="fa-solid fa-image" aria-hidden="true"></i>
                    <span>圖文版預報</span>
                </h3>

                <div class="flex items-center gap-2">
                    <a :href="graphicImageUrl" download="澳門今明兩日天氣預報.png"
                       class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium
                              bg-blue-700 text-white hover:bg-blue-800 transition-colors">
                        <i class="fa-solid fa-download" aria-hidden="true"></i>
                        <span>下載圖片</span>
                    </a>

                    <button type="button"
                            class="text-gray-500 hover:text-gray-800 hover:bg-gray-200 rounded-full w-9 h-9 flex items-center justify-center transition-colors"
                            aria-label="關閉圖文版"
                            @click="closeGraphic">
                        <i class="fa-solid fa-times" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- 圖片顯示區 -->
            <div class="overflow-y-auto p-4 sm:p-6 bg-gray-100 flex justify-center">
                <!-- 🌟 這裡直接加載 Python 生成的圖片，並加上時間戳防止緩存 -->
                <img :src="graphicImageUrl" 
                     alt="今明兩日天氣預報圖文版" 
                     class="max-w-full h-auto shadow-md border border-gray-300 bg-white"
                     @load="imageLoading = false"
                     v-show="!imageLoading">
                     
                <!-- 圖片載入中的 Loading 提示 -->
                <div v-if="imageLoading" class="flex flex-col items-center justify-center py-20 text-gray-500">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-600"></i>
                    <p>圖片載入中...</p>
                </div>
            </div>

            <div class="px-5 py-3 border-t border-gray-200 bg-gray-50 text-center text-xs text-gray-500 flex-shrink-0">
                點擊背景或按 ESC 可關閉此視窗
            </div>
        </div>
    </div>

</div>

<script>
    const { createApp } = Vue;

    createApp({
        data() {
            return {
                text: '載入中…',
                showGraphic: false,
                imageLoading: true,
                graphicImageUrl: '' // 動態生成圖片 URL
            };
        },

        mounted() {
            this.loadText();
            document.addEventListener('keydown', this.handleKeydown);
        },

        beforeUnmount() {
            document.removeEventListener('keydown', this.handleKeydown);
            document.body.style.overflow = '';
        },

        methods: {
            async loadText() {
                try {
                    const res = await fetch('weather2d.txt', { cache: 'no-store' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const raw = (await res.text()).replace(/^\uFEFF/, '').trim();
                    this.text = raw;
                } catch (e) {
                    console.error('讀取 weather2d.txt 失敗:', e);
                    this.text = '（天氣資料暫時無法載入）';
                }
            },

            openGraphic() {
                this.showGraphic = true;
                this.imageLoading = true;
                // 加上時間戳，強制瀏覽器抓取最新的 Python 生成圖片
                this.graphicImageUrl = `weather2d_graphic.png?t=${Date.now()}`;
                document.body.style.overflow = 'hidden';
            },

            closeGraphic() {
                this.showGraphic = false;
                document.body.style.overflow = '';
            },

            handleKeydown(e) {
                if (e.key === 'Escape' && this.showGraphic) {
                    this.closeGraphic();
                }
            }
        }
    }).mount('#app');
</script>
</body>
</html>
