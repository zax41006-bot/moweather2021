name: Auto Update Weather Graphics

on:
  push:
    branches:
      - main
    paths:
      # 🌟 當這三個資料檔更新時觸發
      - 'weather2d.txt'
      - 'weather7d.txt'
      - 'forecast.txt'
      # 🌟 當你修改了繪圖腳本本身時也觸發（方便測試）
      - 'weather_forecast_2d.py'
      - 'weather_forecast_7d.py'
  workflow_dispatch: # 允許你在網頁上手動點擊測試

permissions:
  contents: write # 允許機器人把生成的新圖片 Commit 回倉庫

jobs:
  generate_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: pip install Pillow

      - name: 🌟 安裝中文字體 (防止生成的圖片中文變方塊)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 生成「今明兩日」預報圖
        run: python weather_forecast_2d.py

      - name: 生成「七日」預報圖
        run: python weather_forecast_7d.py

      - name: 提交並推送新圖片
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          # 把生成的新圖片加進 Git 追蹤
          git add weather2d_graphic.png weather7d_graphic.png
          
          # 如果有變動才 Commit，加上 [skip ci] 避免無限循環
          # 加上 git pull --rebase 防止與 TG 發送的工作流發生 Git 衝突
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update weather graphics [skip ci]" && git pull --rebase origin main && git push)