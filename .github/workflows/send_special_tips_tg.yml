name: Send Special Tips to Telegram

on:
  push:
    branches:
      - main
    paths:
      # 🌟 只有當 special-tips.txt 被修改時才觸發
      - 'special-tips.txt'
  workflow_dispatch: # 允許手動測試

permissions:
  contents: write

jobs:
  send_tips:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴
        run: pip install requests

      - name: 執行發送腳本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python send_special_tips_tg.py

      - name: 提交記憶檔
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          git add _last_special_tips.txt
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Special Tips TG state [skip ci]" && git pull --rebase origin main && git push)