name: Send Weather Warnings to Telegram

on:
  push:
    branches:
      - main
    paths:
      # 🌟 只有當 warnings.txt 被修改時才觸發
      - 'warnings.txt'
  workflow_dispatch: # 允許在網頁上手動點擊測試

permissions:
  contents: write # 允許機器人把記憶檔 Commit 回倉庫

jobs:
  send_warnings:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴
        run: pip install requests

      - name: 執行發送警報腳本
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python send_warnings_tg.py

      - name: 提交記憶檔 (防止重複發送)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          # 加入警報專屬的記憶檔
          git add _last_warnings.txt
          
          # 如果有變動才 commit，並加上 [skip ci]
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Warnings TG state [skip ci]" && git pull --rebase origin main && git push)